[project]
name = "football-odds-analytics"
version = "0.1.0"
description = "Analyse de cotes de bookmakers — probabilités implicites vs résultats observés en Ligue 1 française"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jupyterlab>=4.2",
    "scikit-learn>=1.4",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
